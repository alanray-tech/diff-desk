name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The dev group of pyproject.toml, which pins ruff.
          pip install --group dev

      - name: Install browser engines
        run: playwright install --with-deps chromium firefox webkit

      - name: Lint
        run: |
          ruff check .
          ruff format --diff .

      - name: Test
        # -m "" lifts the default "not slow": CI runs the browser tests too.
        run: python -m pytest -p no:randomly -m ""
        env:
          # The suite builds its own repository, so git needs an identity to commit with.
          GIT_AUTHOR_NAME: desk
          GIT_AUTHOR_EMAIL: desk@example.com
          GIT_COMMITTER_NAME: desk
          GIT_COMMITTER_EMAIL: desk@example.com
