[dependency-groups]
# What the tests and the linter need; the desk itself runs on the standard library alone. Ruff is pinned for the reason
# given in .pre-commit-config.yaml.
dev = ["pytest", "playwright", "ruff==0.15.7"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pinned rather than inherited, so a newer ruff does not change what passes.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PL", "DTZ", "BLE"]

[tool.ruff.lint.per-file-ignores]
# A status code or a row count read straight from the assertion is clearer than a name for it.
"tests/*" = ["PLR2004"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
known-first-party = ["conftest", "desk", "gen_diff_data", "serve_diff"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests are left out of a plain run; `-m slow` runs them alone, `-m ""` runs everything (as CI does).
addopts = "-xsv -m 'not slow'"
markers = ["slow: drives a real browser or waits on a stand-in service; takes seconds per test"]
